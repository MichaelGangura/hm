<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Гуртівня О.Д.А. пропонує ортопедичні матраци по вигідній ціні.">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <title>Матраци</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #026C3B;
            padding: 20px;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: auto;
            background-color: #f5f5f5;
        }

        .mm {
            display: none;
        }

        .m {
            display: block;
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 550px) {
            .m {
                display: none;
            }
            .mm {
                display: block;
                max-width: 100%;
                height: auto;
            }
        }

    </style>
</head>

<body>
    <div class="wrapper">
        <img src="mattresses.png" alt="Матраци" class="m">
        <img src="mattress_m.png" alt="Матраци" class="mm">
    </div>
     
</body>

</html>
